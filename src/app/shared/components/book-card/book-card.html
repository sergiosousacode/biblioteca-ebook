<article>
  <div class="cover"><img [src]="book().coverUrl" [alt]="'Capa de ' + book().title" width="360" height="460" loading="lazy"></div>
  <p class="category">{{ categoryName() }}</p>
  <h3>{{ book().title }}</h3>
  <p class="author">{{ book().author }}</p>
  <p class="synopsis">{{ book().synopsis }}</p>
</article>
